function toBengaliDigits(num) {
  const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  return String(num).split('').map(d => bn[d] || d).join('');
}

function loadFromUrlParam() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (id) {
    document.getElementById('searchInput').value = id;
    searchRecord();
  }
}

function searchRecord() {
  const query = document.getElementById('searchInput').value.trim();
  const result = document.getElementById('result');
  const notFound = document.getElementById('notFound');

  const record = records[query];
  if (!record) {
    result.style.display = "none";
    notFound.style.display = "block";
    return;
  }

  document.getElementById('certNo').textContent = record.certNo;
  document.getElementById('certDate').textContent = record.certDate;
  document.getElementById('deceasedName').textContent = record.deceasedName;
  document.getElementById('fatherName').textContent = record.fatherName;
  document.getElementById('motherName').textContent = record.motherName;
  document.getElementById('address').textContent = record.address;
  document.getElementById('declaration').textContent = record.declaration;

  const tbody = document.getElementById('heirsBody');
  tbody.innerHTML = "";
  record.heirs.forEach((h, i) => {
    const tr = document.createElement('tr');
    const serial = toBengaliDigits(i + 1).padStart(2, '০');
    tr.innerHTML = `<td>${serial}</td><td>${h.name}</td><td>${h.id}</td><td>${h.dob}</td><td>${h.relation}</td><td>${h.remark || '--'}</td>`;
    tbody.appendChild(tr);
  });

  notFound.style.display = "none";
  result.style.display = "block";
}

window.onload = loadFromUrlParam;
</script>
